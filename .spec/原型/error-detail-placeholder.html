<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>错误详情（存量页占位） · web-monitor 原型</title>
<style>
:root { --c-bg:#f7f7f8; --c-surface:#fff; --c-border:#e5e5e6; --c-text:#1f1f1f; --c-text-2:#6b6b6b; --c-primary:#0f766e; }
* { box-sizing:border-box; margin:0; padding:0; }
body { font-family:"PingFang SC","Microsoft YaHei",sans-serif; background:var(--c-bg); color:var(--c-text); font-size:14px; display:flex; justify-content:center; padding-top:10vh; }
.card { background:var(--c-surface); border:1px solid var(--c-border); border-radius:6px; padding:32px 40px; width:520px; text-align:center; }
h1 { font-size:17px; margin-bottom:12px; }
p { color:var(--c-text-2); margin-bottom:8px; line-height:1.6; }
a { color:var(--c-primary); }
.note { margin-top:16px; font-size:12px; color:var(--c-text-2); border-top:1px dashed var(--c-border); padding-top:12px; }
</style>
</head>
<body>
<div class="card">
  <h1>错误详情页（存量系统页面 · 原型占位）</h1>
  <p>实时大屏的错误条目会以<b>新开视图</b>方式打开本页，并按<b>错误事件标识</b>定位到对应错误。</p>
  <p>真实页面由既有「错误与溯源」模块提供，不在本原型范围内。</p>
  <p>在真实产品中，<b>关闭本视图即回到未中断的大屏</b>，大屏按原应用继续自动更新。</p>
  <p style="margin-top:12px;"><a href="index.html">← 返回实时大屏（原型内兜底入口）</a></p>
  <div class="note">本页为低保真原型占位页，仅用于验证「点击错误条目 → 跳转详情」的跳转闭环。</div>
</div>
</body>
</html>
